<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sync Music</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="app">
        <header class="header fade-in">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                </div>
                <h1>Sync Music</h1>
            </div>
            <div class="room-info glass">
                <span>Комната: <strong id="roomIdDisplay"></strong></span>
                <button class="btn btn-ghost btn-small" onclick="copyRoomLink()">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                    </svg>
                    Копировать
                </button>
            </div>
        </header>

        <section class="section glass fade-in" style="animation-delay: 0.1s;">
            <h2 class="section-title">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                Поиск
            </h2>
            <div class="search-row">
                <div class="search-input-wrap">
                    <input id="searchInput" class="input" placeholder="Что хочешь послушать?">
                </div>
                <button class="btn btn-primary" onclick="search()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/>
                    </svg>
                    Найти
                </button>
            </div>
            <div id="results" class="track-list"></div>
        </section>

        <div class="tabs fade-in" style="animation-delay: 0.2s;">
            <button id="tabQueue" class="tab active" onclick="switchTab('queue')">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h12v2H3z"/>
                </svg>
                Очередь
            </button>
            <button id="tabLibrary" class="tab" onclick="switchTab('library')">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                Библиотека
            </button>
        </div>

        <section id="queueView" class="section glass fade-in" style="animation-delay: 0.3s;">
            <div id="queue" class="track-list">
                <div class="empty">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" opacity="0.3">
                        <path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h12v2H3z"/>
                    </svg>
                    <p>Очередь пуста</p>
                    <span>Добавь треки из поиска</span>
                </div>
            </div>
        </section>

        <section id="libraryView" class="section glass" style="display: none;">
            <div id="library" class="track-list">
                <div class="empty">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" opacity="0.3">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <p>Библиотека пуста</p>
                    <span>Лайкай треки, чтобы сохранить их</span>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="addAllLibraryToQueue()" style="margin-top: 12px;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
                Добавить всё в очередь
            </button>
        </section>
    </div>

    <!-- Плеер -->
    <div id="player" class="player">
        <div class="player-bg"></div>
        <div class="player-inner">
            <button class="player-collapse" id="playerCollapse" onclick="toggleCollapse()" title="Свернуть">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
                </svg>
            </button>
            <div class="player-header">
                <div class="player-cover-wrap">
                    <img id="playerCover" class="player-cover" src="" alt="">
                    <div class="player-cover-glow"></div>
                </div>
                <div class="player-info">
                    <div id="nowPlaying" class="player-title">—</div>
                    <div id="playerArtist" class="player-artist"></div>
                </div>
                <button class="player-like" id="playerLikeBtn" onclick="likeCurrentTrack()" title="В библиотеку">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                </button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-thumb"></div>
                </div>
            </div>
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>

            <div class="controls-row">
                <button class="ctrl-btn" onclick="prevTrack()" title="Предыдущий (←)">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="play-btn" id="playPauseBtn" onclick="togglePlay()" title="Играть / Пауза (Space)">
                    <svg id="playIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display:none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <button class="ctrl-btn" onclick="nextTrack()" title="Следующий (→)">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>

                <div class="volume-container">
                    <span class="volume-icon" id="volumeIcon" onclick="toggleMute()" title="Звук (M)">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </div>
        <audio id="audio"></audio>
    </div>

    <div id="toast" class="toast"></div>
    <div id="status" class="status">Подключение...</div>

    <script src="app.js?v=3"></script>
</body>
</html>
