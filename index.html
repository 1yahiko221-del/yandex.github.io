<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sync Music</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; background: #111; color: #eee; }
        h1 { color: #fff; }
        h2 { color: #1db954; font-size: 18px; margin-top: 24px; }
        input, button { font-size: 16px; padding: 8px 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #eee; }
        button { cursor: pointer; background: #1db954; border: none; color: #000; font-weight: bold; }
        button:hover { background: #1ed760; }
        button.secondary { background: #333; color: #eee; }
        button.secondary:hover { background: #444; }
        button.small { font-size: 12px; padding: 4px 8px; }
        #results div, #queue div { padding: 10px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        #results div:hover, #queue div:hover { background: #222; }
        #results .info, #queue .info { flex: 1; cursor: pointer; }
        #status { color: #888; font-size: 14px; margin-top: 16px; }
        #roomInfo { color: #1db954; font-size: 14px; margin-top: 8px; }
        .current { background: #1a3a1a !important; border-left: 3px solid #1db954; }

        /* --- Плеер --- */
        #player {
            margin-top: 24px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            display: none;
        }
        #player.visible { display: block; }
        #nowPlaying {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-container {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
        }
        .progress-bar {
            height: 100%;
            background: #1db954;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .progress-container:hover .progress-bar { background: #1ed760; }
        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }
        .controls-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .play-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1db954;
            color: #000;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
            line-height: 1;
            padding-left: 2px; /* компенсация визуального смещения треугольника */
        }
        .play-btn:hover { background: #1ed760; transform: scale(1.05); }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #eee;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover { color: #1db954; }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            background: #222;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .volume-icon {
            font-size: 16px;
            color: #aaa;
            user-select: none;
        }
        .volume-slider {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            background: #444;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #1db954;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #1db954;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        .volume-slider::-moz-range-track {
            height: 4px;
            background: #444;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <h1>🎵 Sync Music</h1>

    <div id="roomInfo">
        Комната: <span id="roomIdDisplay"></span>
        <button class="small secondary" onclick="copyRoomLink()">Копировать ссылку</button>
    </div>

    <h2>🔍 Поиск</h2>
    <div>
        <input id="searchInput" placeholder="Поиск трека..." style="width: 65%;">
        <button onclick="search()">Найти</button>
    </div>
    <div id="results"></div>

    <h2>📋 Очередь</h2>
    <div id="queue"><div style="color: #666;">Очередь пуста</div></div>

    <!-- Кастомный плеер -->
    <div id="player">
        <div id="nowPlaying">—</div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
        <div class="controls-row">
            <button class="ctrl-btn" onclick="prevTrack()" title="Предыдущий">⏮</button>
            <button class="play-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextTrack()" title="Следующий">⏭</button>
            <div class="volume-container">
                <span class="volume-icon">🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>
        <audio id="audio" style="display: none;"></audio>
    </div>

    <div id="status">Подключение...</div>

    <script>
        const API_BASE = "https://yandex-sync-backend.onrender.com";

        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        if (!roomId) {
            roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            window.history.replaceState({}, '', `?room=${roomId}`);
        }
        document.getElementById('roomIdDisplay').textContent = roomId;

        const WS_URL = API_BASE.replace("https://", "wss://").replace("http://", "ws://") + `/ws/${roomId}`;

        let ws = null;
        let isSyncing = false;
        let reconnectTimer = null;
        let localQueue = [];
        let localCurrentIndex = -1;
        let isSeeking = false;

        const clientId = Math.random().toString(36).substring(2, 10);

        function connectWS() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                document.getElementById("status").textContent = "🟢 Подключено к комнате";
                if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            };

            ws.onclose = () => {
                document.getElementById("status").textContent = "🔴 Отключено, переподключение...";
                if (!reconnectTimer) {
                    reconnectTimer = setTimeout(() => { reconnectTimer = null; connectWS(); }, 3000);
                }
            };

            ws.onerror = () => {
                document.getElementById("status").textContent = "⚠️ Ошибка соединения";
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const audio = document.getElementById("audio");

                if (msg.type === "queue_update") {
                    localQueue = msg.queue || [];
                    localCurrentIndex = msg.current_index ?? -1;
                    renderQueue();
                } else if (msg.type === "play_track") {
                    playTrackFromQueue(msg.track, msg.index);
                } else if (msg.type === "play") {
                    isSyncing = true;
                    audio.currentTime = msg.time || 0;
                    audio.play().catch(() => {}).finally(() => { isSyncing = false; });
                } else if (msg.type === "pause") {
                    isSyncing = true;
                    audio.pause();
                    isSyncing = false;
                } else if (msg.type === "seek") {
                    isSyncing = true;
                    audio.currentTime = msg.time;
                    isSyncing = false;
                }
            };
        }

        function send(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                msg.sender = clientId;
                ws.send(JSON.stringify(msg));
            }
        }

        function copyRoomLink() {
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(link).then(() => {
                alert("Ссылка скопирована! Отправь другу.");
            }).catch(() => {
                prompt("Скопируй ссылку вручную:", link);
            });
        }

        // --- Поиск ---
        async function search() {
            const query = document.getElementById("searchInput").value.trim();
            if (!query) return;

            try {
                const res = await fetch(`${API_BASE}/api/search`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                const container = document.getElementById("results");
                container.innerHTML = "";
                if (!data.tracks || data.tracks.length === 0) {
                    container.innerHTML = "<div>Ничего не найдено</div>";
                    return;
                }
                data.tracks.forEach(track => {
                    const div = document.createElement("div");
                    const info = document.createElement("div");
                    info.className = "info";
                    info.textContent = `${track.artist} — ${track.title} (${track.duration}с)`;
                    info.onclick = () => addToQueue(track);
                    const addBtn = document.createElement("button");
                    addBtn.className = "small";
                    addBtn.textContent = "+ В очередь";
                    addBtn.onclick = (e) => { e.stopPropagation(); addToQueue(track); };
                    div.appendChild(info);
                    div.appendChild(addBtn);
                    container.appendChild(div);
                });
            } catch (e) {
                console.error("Search error:", e);
                document.getElementById("results").innerHTML = `<div>Ошибка: ${e.message}</div>`;
            }
        }

        function addToQueue(track) {
            send({
                type: "add_to_queue",
                track_id: String(track.id),
                title: track.title,
                artist: track.artist,
            });
        }

        function playTrackFromQueue(track, index) {
            const audio = document.getElementById("audio");
            audio.src = track.url;
            audio.currentTime = 0;
            document.getElementById("nowPlaying").textContent = `${track.artist} — ${track.title}`;
            document.getElementById("player").classList.add("visible");
            localCurrentIndex = index;
            renderQueue();
            isSyncing = true;
            audio.play().catch(err => console.warn("Autoplay blocked:", err)).finally(() => { isSyncing = false; });
        }

        function togglePlay() {
            const audio = document.getElementById("audio");
            if (audio.paused) {
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        }

        function nextTrack() {
            send({ type: "next_track" });
        }

        function prevTrack() {
            send({ type: "prev_track" });
        }

        // --- Прогресс-бар ---
        const progressContainer = document.getElementById("progressContainer");
        const progressBar = document.getElementById("progressBar");
        const currentTimeEl = document.getElementById("currentTime");
        const totalTimeEl = document.getElementById("totalTime");
        const playPauseBtn = document.getElementById("playPauseBtn");

        progressContainer.addEventListener("click", (e) => {
            const audio = document.getElementById("audio");
            if (!audio.duration) return;
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            const newTime = percent * audio.duration;
            audio.currentTime = newTime;
            send({ type: "seek", time: newTime });
        });

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, "0")}`;
        }

        const audio = document.getElementById("audio");

        audio.addEventListener("timeupdate", () => {
            if (isSeeking) return;
            const percent = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
            progressBar.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener("loadedmetadata", () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener("play", () => {
            playPauseBtn.textContent = "❚❚";
            if (!isSyncing) send({ type: "play", time: audio.currentTime });
        });

        audio.addEventListener("pause", () => {
            playPauseBtn.textContent = "▶";
            if (!isSyncing) send({ type: "pause" });
        });

        audio.addEventListener("ended", () => {
            send({ type: "track_ended" });
        });

        // --- Громкость ---
        const volumeSlider = document.getElementById("volumeSlider");
        volumeSlider.addEventListener("input", () => {
            audio.volume = parseFloat(volumeSlider.value);
        });

        // --- Отрисовка очереди ---
        function renderQueue() {
            const container = document.getElementById("queue");
            container.innerHTML = "";
            if (localQueue.length === 0) {
                container.innerHTML = '<div style="color: #666;">Очередь пуста</div>';
                return;
            }
            localQueue.forEach((track, i) => {
                const div = document.createElement("div");
                if (i === localCurrentIndex) div.classList.add("current");
                const info = document.createElement("div");
                info.className = "info";
                info.textContent = `${i + 1}. ${track.artist} — ${track.title}`;
                info.onclick = () => {
                    send({ type: "play_track_manual", index: i });
                };
                const removeBtn = document.createElement("button");
                removeBtn.className = "small secondary";
                removeBtn.textContent = "✕";
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    send({ type: "remove_from_queue", index: i });
                };
                div.appendChild(info);
                div.appendChild(removeBtn);
                container.appendChild(div);
            });
        }

        connectWS();
    </script>
</body>
</html>
