<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Music</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        input, button { font-size: 16px; padding: 8px 12px; }
        #results div { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
        #results div:hover { background: #f5f5f5; }
        #player { margin-top: 20px; }
        #status { color: #666; font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>🎵 Sync Music</h1>

    <div>
        <input id="searchInput" placeholder="Поиск трека..." style="width: 70%;">
        <button onclick="search()">Найти</button>
    </div>

    <div id="results"></div>

    <div id="player" style="display:none;">
        <h3 id="nowPlaying"></h3>
        <audio id="audio" controls style="width: 100%;"></audio>
    </div>

    <div id="status">Отключено от сервера</div>

    <script>
        // ⚠️ ЗАМЕНИ НА URL СВОЕГО БЭКЕНДА НА RENDER
        const API_BASE = "https://yandex-sync-backend.onrender.com/";
        const WS_URL = API_BASE.replace("https://", "wss://") + "/ws";

        let ws = null;
        let isSyncing = false;

        // --- WebSocket подключение ---
        function connectWS() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                document.getElementById("status").textContent = "🟢 Подключено";
            };

            ws.onclose = () => {
                document.getElementById("status").textContent = "🔴 Отключено";
                setTimeout(connectWS, 3000);
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const audio = document.getElementById("audio");

                if (msg.type === "play") {
                    isSyncing = true;
                    audio.currentTime = msg.time || 0;
                    audio.play().then(() => isSyncing = false);
                } else if (msg.type === "pause") {
                    isSyncing = true;
                    audio.pause();
                    isSyncing = false;
                } else if (msg.type === "seek") {
                    audio.currentTime = msg.time;
                } else if (msg.type === "track") {
                    loadTrack(msg.url, msg.title);
                }
            };
        }

        function send(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
            }
        }

        // --- Поиск ---
        async function search() {
            const query = document.getElementById("searchInput").value;
            if (!query) return;

            const res = await fetch(`${API_BASE}/api/search`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query })
            });
            const data = await res.json();

            const container = document.getElementById("results");
            container.innerHTML = "";
            data.tracks.forEach(track => {
                const div = document.createElement("div");
                div.textContent = `${track.artist} — ${track.title} (${track.duration}с)`;
                div.onclick = () => selectTrack(track);
                container.appendChild(div);
            });
        }

        // --- Выбор трека ---
        async function selectTrack(track) {
            const res = await fetch(`${API_BASE}/api/get_link`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ track_id: track.id })
            });
            const data = await res.json();

            const title = `${track.artist} — ${track.title}`;
            send({ type: "track", url: data.url, title });
            loadTrack(data.url, title);
        }

        function loadTrack(url, title) {
            const audio = document.getElementById("audio");
            audio.src = url;
            audio.currentTime = 0;
            document.getElementById("nowPlaying").textContent = title;
            document.getElementById("player").style.display = "block";
        }

        // --- Синхронизация событий плеера ---
        const audio = document.getElementById("audio");
        audio.addEventListener("play", () => {
            if (!isSyncing) send({ type: "play", time: audio.currentTime });
        });
        audio.addEventListener("pause", () => {
            if (!isSyncing) send({ type: "pause" });
        });
        audio.addEventListener("seeked", () => {
            if (!isSyncing) send({ type: "seek", time: audio.currentTime });
        });

        connectWS();
    </script>
</body>
</html>
