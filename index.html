<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sync Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>🎵 Sync Music</h1>
            <div class="room-info">
                <span>Комната: <strong id="roomIdDisplay"></strong></span>
                <button class="btn btn-secondary btn-small" onclick="copyRoomLink()">Копировать ссылку</button>
            </div>
        </header>

        <section class="section">
            <h2>🔍 Поиск</h2>
            <div class="search-row">
                <input id="searchInput" class="input" placeholder="Поиск трека...">
                <button class="btn" onclick="search()">Найти</button>
            </div>
            <div id="results" class="track-list"></div>
        </section>

        <div class="tabs">
            <button id="tabQueue" class="tab active" onclick="switchTab('queue')">📋 Очередь</button>
            <button id="tabLibrary" class="tab" onclick="switchTab('library')">❤️ Моя библиотека</button>
        </div>

        <section id="queueView" class="section">
            <div id="queue" class="track-list">
                <div class="empty">Очередь пуста</div>
            </div>
        </section>

        <section id="libraryView" class="section" style="display: none;">
            <div id="library" class="track-list">
                <div class="empty">Библиотека пуста</div>
            </div>
            <button class="btn btn-secondary" onclick="addAllLibraryToQueue()" style="margin-top: 12px;">
                ➕ Добавить всё в очередь
            </button>
        </section>

        <!-- Плеер -->
        <div id="player" class="player">
            <div class="player-header">
                <img id="playerCover" class="player-cover" src="" alt="">
                <div class="player-info">
                    <div id="nowPlaying" class="player-title">—</div>
                    <div id="playerArtist" class="player-artist"></div>
                </div>
                <button class="player-like" id="playerLikeBtn" onclick="likeCurrentTrack()" title="В библиотеку">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                </button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>

            <div class="controls-row">
                <button class="ctrl-btn" onclick="prevTrack()" title="Предыдущий">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="play-btn" id="playPauseBtn" onclick="togglePlay()">
                    <svg id="playIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <button class="ctrl-btn" onclick="nextTrack()" title="Следующий">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>

                <div class="volume-container">
                    <span class="volume-icon" id="volumeIcon" onclick="toggleMute()">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
            <audio id="audio"></audio>
        </div>

        <div id="status" class="status">Подключение...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
