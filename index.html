<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sync Music</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; background: #111; color: #eee; }
        h1 { color: #fff; }
        input, button { font-size: 16px; padding: 8px 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #eee; }
        button { cursor: pointer; background: #1db954; border: none; color: #000; font-weight: bold; }
        button:hover { background: #1ed760; }
        #results div { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
        #results div:hover { background: #222; }
        #player { margin-top: 20px; }
        #status { color: #888; font-size: 14px; margin-top: 16px; }
        #roomInfo { color: #1db954; font-size: 14px; margin-top: 8px; }
        audio { width: 100%; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>🎵 Sync Music</h1>

    <div id="roomInfo">Комната: <span id="roomIdDisplay"></span> <button onclick="copyRoomLink()" style="font-size: 12px; padding: 4px 8px;">Копировать ссылку</button></div>

    <div style="margin-top: 16px;">
        <input id="searchInput" placeholder="Поиск трека..." style="width: 65%;">
        <button onclick="search()">Найти</button>
    </div>

    <div id="results"></div>

    <div id="player" style="display:none;">
        <h3 id="nowPlaying"></h3>
        <audio id="audio" controls></audio>
    </div>

    <div id="status">Подключение...</div>

    <script>
        const API_BASE = "https://yandex-sync-backend.onrender.com";
        
        // Получаем ID комнаты из URL или генерируем новый
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        if (!roomId) {
            roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            // Обновляем URL без перезагрузки
            window.history.replaceState({}, '', `?room=${roomId}`);
        }
        document.getElementById('roomIdDisplay').textContent = roomId;

        const WS_URL = API_BASE.replace("https://", "wss://").replace("http://", "ws://") + `/ws/${roomId}`;

        let ws = null;
        let isSyncing = false;
        let reconnectTimer = null;

        // Уникальный ID для этого клиента, чтобы игнорировать своё эхо
        const clientId = Math.random().toString(36).substring(2, 10);

        function connectWS() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                document.getElementById("status").textContent = "🟢 Подключено к комнате";
                if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            };

            ws.onclose = () => {
                document.getElementById("status").textContent = "🔴 Отключено, переподключение...";
                if (!reconnectTimer) {
                    reconnectTimer = setTimeout(() => { reconnectTimer = null; connectWS(); }, 3000);
                }
            };

            ws.onerror = () => {
                document.getElementById("status").textContent = "⚠️ Ошибка соединения";
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                
                // Игнорируем свои же сообщения
                if (msg.sender === clientId) return;

                const audio = document.getElementById("audio");

                if (msg.type === "track") {
                    loadTrack(msg.url, msg.title, false);
                } else if (msg.type === "play") {
                    isSyncing = true;
                    audio.currentTime = msg.time || 0;
                    audio.play().catch(() => {}).finally(() => { isSyncing = false; });
                } else if (msg.type === "pause") {
                    isSyncing = true;
                    audio.pause();
                    isSyncing = false;
                } else if (msg.type === "seek") {
                    isSyncing = true;
                    audio.currentTime = msg.time;
                    isSyncing = false;
                }
            };
        }

        function send(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                msg.sender = clientId; // Добавляем свой ID
                ws.send(JSON.stringify(msg));
            }
        }

        function copyRoomLink() {
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(link).then(() => {
                alert("Ссылка скопирована! Отправь другу.");
            }).catch(() => {
                prompt("Скопируй ссылку вручную:", link);
            });
        }

        async function search() {
            const query = document.getElementById("searchInput").value.trim();
            if (!query) return;

            try {
                const res = await fetch(`${API_BASE}/api/search`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query })
                });
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    throw new Error(`HTTP ${res.status}: ${JSON.stringify(errorData)}`);
                }
                const data = await res.json();

                const container = document.getElementById("results");
                container.innerHTML = "";
                if (!data.tracks || data.tracks.length === 0) {
                    container.innerHTML = "<div>Ничего не найдено</div>";
                    return;
                }
                data.tracks.forEach(track => {
                    const div = document.createElement("div");
                    div.textContent = `${track.artist} — ${track.title} (${track.duration}с)`;
                    div.onclick = () => selectTrack(track);
                    container.appendChild(div);
                });
            } catch (e) {
                console.error("Search error:", e);
                document.getElementById("results").innerHTML = `<div>Ошибка: ${e.message}</div>`;
            }
        }

        async function selectTrack(track) {
            try {
                const res = await fetch(`${API_BASE}/api/get_link`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ track_id: String(track.id) })
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    const detail = errorData.detail ? JSON.stringify(errorData.detail) : "Неизвестная ошибка";
                    throw new Error(`HTTP ${res.status}: ${detail}`);
                }

                const data = await res.json();
                const title = `${track.artist} — ${track.title}`;
                send({ type: "track", url: data.url, title });
                loadTrack(data.url, title, true);
            } catch (e) {
                console.error("Link error:", e);
                alert("Не удалось получить ссылку: " + e.message);
            }
        }

        function loadTrack(url, title, autoplay) {
            const audio = document.getElementById("audio");
            audio.src = url;
            audio.currentTime = 0;
            document.getElementById("nowPlaying").textContent = title;
            document.getElementById("player").style.display = "block";
            if (autoplay) {
                audio.play().catch(err => console.warn("Autoplay blocked:", err));
            }
        }

        const audio = document.getElementById("audio");
        audio.addEventListener("play", () => {
            if (!isSyncing) send({ type: "play", time: audio.currentTime });
        });
        audio.addEventListener("pause", () => {
            if (!isSyncing) send({ type: "pause" });
        });
        audio.addEventListener("seeked", () => {
            if (!isSyncing) send({ type: "seek", time: audio.currentTime });
        });

        connectWS();
    </script>
</body>
</html>
